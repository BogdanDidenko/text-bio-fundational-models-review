<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Source-backed representations, operations and architecture assemblies for generative text-bio models.">
  <title>Data Transformation Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="library.css">
  <script defer src="vendor/dagre-1.1.5.min.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script defer src="library.js"></script>
</head>
<body>
  <a class="skip" href="#workspace">Skip to library</a>
  <header>
    <div class="brand"><span class="eyebrow">TEXT–BIO / DATA TRANSFORMATIONS</span><h1>Operation library</h1></div>
    <nav aria-label="Project"><a href="../"><i data-lucide="network"></i>Evidence atlas</a><a href="data/catalog.json" download title="Download complete catalog"><i data-lucide="download"></i>Catalog</a><a href="https://github.com/BogdanDidenko/text-bio-fundational-models-review" title="Repository"><i data-lucide="github"></i>Repository</a></nav>
  </header>
  <div class="release-bar"><span id="release">Loading release…</span><span id="totals"></span></div>
  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="Library views"><button role="tab" aria-selected="true" data-view="blocks">Operations</button><button role="tab" aria-selected="false" data-view="assemblies">Model chains</button><button role="tab" aria-selected="false" data-view="proposals">Unexpanded steps</button><button role="tab" aria-selected="false" data-view="reuse">Cross-paper reuse</button></div>
    <label class="search"><i data-lucide="search"></i><input id="search" type="search" placeholder="Search definitions, models, source labels…" aria-label="Search library"></label>
  </div>
  <main id="workspace">
    <aside class="catalog-pane">
      <div class="filter-row"><label>Reuse<select id="reuse"><option value="">All operations</option><option value="shared">Multiple papers</option><option value="single">One pilot paper</option><option value="supplemental">Supplemental examples</option></select></label><label>Paper<select id="paper"><option value="">All pilot papers</option></select></label></div>
      <div class="list-heading"><span id="list-label">CATALOG</span><span id="count" aria-live="polite"></span></div>
      <div id="catalog-list"></div>
    </aside>
    <section id="detail" class="detail" aria-live="polite"><p class="status">Loading source-backed definitions…</p></section>
  </main>
  <footer><span>Source-backed operation constructor · four-paper pilot</span><a href="data/validation.json">Validation</a><a href="data/assembly.schema.json">Chain schema</a><a href="data/catalog-seed.schema.json">Library schema</a></footer>
</body>
</html>
