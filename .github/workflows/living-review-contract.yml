name: Living review contract

on:
  push:
    branches: [main]
    paths:
      - "config/living_review_pipeline.json"
      - "protocol/LIVING_REVIEW_RUNBOOK.md"
      - "protocol/living_review_method_lock_v1.json"
      - "protocol/living_review_update_pipeline_2026-08-09.md"
      - "scripts/**"
      - "tests/test_living_review_runner_contract.py"
      - ".github/workflows/living-review-contract.yml"
  pull_request:
    paths:
      - "config/living_review_pipeline.json"
      - "protocol/LIVING_REVIEW_RUNBOOK.md"
      - "protocol/living_review_method_lock_v1.json"
      - "protocol/living_review_update_pipeline_2026-08-09.md"
      - "scripts/**"
      - "tests/test_living_review_runner_contract.py"
      - ".github/workflows/living-review-contract.yml"

permissions:
  contents: read

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify routine F6/F7 and checkout contracts
        run: python -m unittest tests.test_living_review_runner_contract
      - name: Verify locked method files and parameters
        run: |
          python scripts/verify_living_review_method_lock.py \
            --current-taxonomy-tree \
            data/living_catalog/taxonomy_rerun_preflight_2026-08-12/snapshot_full_55_semantic_correction_2026-08-17/taxonomy_tree.json
