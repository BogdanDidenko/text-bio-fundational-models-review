name: Deploy input representation atlas

on:
  push:
    branches:
      - main
      - codex/fulltext-section-screening-audit
    paths:
      - "docs/input-representation-atlas/**"
      - ".github/workflows/deploy-input-representation-atlas.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload atlas
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/input-representation-atlas

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
